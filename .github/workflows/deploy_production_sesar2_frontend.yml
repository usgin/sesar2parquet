name: deploy_production_sesar_frontend
on:
  workflow_dispatch:
  # change to master push when ready for production deployment
  # push:
  #   branches:
  #     - main

jobs:
  build_publish_frontend:
    uses: ./.github/workflows/build_publish.yml
    with:
      APPLICATION: sesar2
      CONTEXT: frontend
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.SESAR_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SESAR_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.SESAR_AWS_REGION }}
  deploy_ecs_frontend_production:
    needs: [build_publish_frontend]
    uses: ./.github/workflows/deploy_ecs.yml
    with:
      APPLICATION: sesar2
      ENVIRONMENT: production
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.SESAR_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SESAR_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.SESAR_AWS_REGION }}
  deploy_ecs_frontend_sandbox:
    needs: [build_publish_frontend]
    uses: ./.github/workflows/deploy_ecs.yml
    with:
      APPLICATION: sesar2
      ENVIRONMENT: sandbox
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.SESAR_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SESAR_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.SESAR_AWS_REGION }}
     